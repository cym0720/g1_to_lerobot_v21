run_id: OFT_20261016_h20_h32_bs32_30k
run_root_dir: /data2/cym_ws/pick_apple_1008_act_dp_groot_20261014/runs
seed: 42
wandb_entity: null
wandb_project: starVLA_pick_apple_20261016_oft_h32_30k
is_debug: false
version_id: "0.21"

# Qwen3.5-0.8B + QwenOFT, unfrozen VLM, horizon 32.
# action_dim=20 = G1 20D native absolute joints; state_dim=20.
# 3 cameras letterbox 224. 4 GPUs x per_device 8 = total bs 32.
framework:
  name: QwenOFT
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3.5-0.8B
    attn_implementation: sdpa
  action_model:
    action_dim: 20
    state_dim: 20
    action_horizon: 32

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    include_state: true
    data_root_dir: /data2/cym_ws/pick_apple_1008_act_dp_groot_20261014/baselines/data_overlay
    data_mix: g1_pick_apple_20261016_train_h32
    action_type: abs
    sequential_step_sampling: false
    per_device_batch_size: 8
    load_all_data_for_training: true
    obs_image_size: [224, 224]
    delete_pause_frame: false
    video_backend: torchvision_av
    num_workers: 4
    pin_memory: true
    drop_last: true

trainer:
  max_train_steps: 30000
  num_warmup_steps: 500
  save_interval: 5000
  eval_interval: 5000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 20
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
